{% extends "base.html" %}

{% block title %}Server Error - TaskFlow{% endblock %}

{% block content %}
<div class="container-fluid" style="min-height: 90vh; display: flex; align-items: center; justify-content: center;">
    <div class="row w-100">
        <div class="col-md-6 mx-auto text-center">
            <div class="card shadow-lg" style="border-radius: 10px; border: none;">
                <div class="card-body p-5">
                    <div style="font-size: 5rem; color: var(--danger-color); margin-bottom: 1rem;">
                        <i class="fas fa-server"></i>
                    </div>
                    <h1 class="h2" style="color: var(--danger-color); margin-bottom: 1rem;">500</h1>
                    <h2 class="h4 text-muted mb-3">Internal Server Error</h2>
                    <p class="text-muted mb-4">
                        Something went wrong on our end. Please try again later.
                    </p>
                    <a href="{{ url_for('main.dashboard') }}" class="btn btn-primary me-2">
                        <i class="fas fa-home"></i> Go to Dashboard
                    </a>
                    <a href="javascript:history.back()" class="btn btn-secondary">
                        <i class="fas fa-arrow-left"></i> Go Back
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
