{% extends "base.html" %}

{% block title %}Register - TaskFlow{% endblock %}

{% block content %}
<div class="container-fluid"
    style="min-height: 90vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
    <div class="row w-100">
        <div class="col-md-6 mx-auto">
            <div class="card shadow-lg" style="border-radius: 10px; border: none;">
                <div class="card-body p-5">
                    <!-- Logo/Title -->
                    <div class="text-center mb-4">
                        <h1 style="color: #4e73df; font-weight: 700;">
                            <i class="fas fa-tasks"></i> TaskFlow
                        </h1>
                        <p class="text-muted">Create Your Account</p>
                    </div>

                    <!-- Registration Form -->
                    <form method="POST" novalidate>
                        <div class="form-group mb-3">
                            <label for="username" class="form-label">
                                <i class="fas fa-user"></i> Username
                            </label>
                            <input type="text" class="form-control" id="username" name="username"
                                placeholder="Choose a username" required>
                            <small class="form-text text-muted">Username must be unique</small>
                        </div>

                        <div class="form-group mb-3">
                            <label for="email" class="form-label">
                                <i class="fas fa-envelope"></i> Email Address
                            </label>
                            <input type="email" class="form-control" id="email" name="email"
                                placeholder="Enter your email" required>
                        </div>

                        <div class="form-group mb-3">
                            <label for="password" class="form-label">
                                <i class="fas fa-lock"></i> Password
                            </label>
                            <input type="password" class="form-control" id="password" name="password"
                                placeholder="Enter password (min 6 characters)" required>
                            <small class="form-text text-muted">Password must be at least 6 characters long</small>
                        </div>

                        <div class="form-group mb-4">
                            <label for="confirm_password" class="form-label">
                                <i class="fas fa-lock"></i> Confirm Password
                            </label>
                            <input type="password" class="form-control" id="confirm_password" name="confirm_password"
                                placeholder="Confirm your password" required>
                        </div>

                        <button type="submit" class="btn btn-primary btn-block w-100 py-2 mb-3">
                            <i class="fas fa-user-plus"></i> Create Account
                        </button>
                    </form>

                    <hr class="my-4">

                    <!-- Login Link -->
                    <div class="text-center">
                        <p class="text-muted">Already have an account?</p>
                        <a href="{{ url_for('auth.login') }}" class="btn btn-outline-primary w-100">
                            <i class="fas fa-sign-in-alt"></i> Login Here
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
