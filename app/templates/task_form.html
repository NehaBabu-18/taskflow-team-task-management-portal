{% extends "base.html" %}

{% block title %}{{ action }} Task - TaskFlow{% endblock %}

{% block content %}
<div class="container-fluid">
    <!-- Page Header -->
    <div class="mb-4">
        <h1 class="h3">
            <i class="fas fa-tasks"></i> {{ action }} Task
        </h1>
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="{{ url_for('main.dashboard') }}">Dashboard</a></li>
                <li class="breadcrumb-item"><a href="{{ url_for('tasks.list_tasks') }}">Tasks</a></li>
                <li class="breadcrumb-item active">{{ action }}</li>
            </ol>
        </nav>
    </div>

    <!-- Form -->
    <div class="row">
        <div class="col-md-8 mx-auto">
            <div class="card shadow-sm">
                <div class="card-header">
                    <h5 class="mb-0">{{ action }} Task Information</h5>
                </div>
                <div class="card-body">
                    <form method="POST" novalidate>
                        <!-- Task Name -->
                        <div class="form-group mb-3">
                            <label for="task_name" class="form-label">
                                <i class="fas fa-heading"></i> Task Name <span class="text-danger">*</span>
                            </label>
                            <input type="text" class="form-control" id="task_name" name="task_name"
                                value="{{ task.task_name if task else '' }}" placeholder="Enter task name" required>
                        </div>

                        <!-- Project -->
                        <div class="form-group mb-3">
                            <label for="project_id" class="form-label">
                                <i class="fas fa-folder"></i> Project <span class="text-danger">*</span>
                            </label>
                            <select class="form-select" id="project_id" name="project_id" required>
                                <option value="">Select a project</option>
                                {% for project in projects %}
                                <option value="{{ project.id }}" {% if task and task.project_id==project.id %}selected{%
                                    endif %}>
                                    {{ project.project_name }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                        <!-- NEW Assigned To Field -->
                        <div class="form-group mb-3">
                            <label for="assigned_to" class="form-label">Assigned To</label>
                            <select class="form-control" id="assigned_to" name="assigned_to">
                                <option value="">-- Leave Unassigned --</option>
                                {% for user in users %}
                                <option value="{{ user.id }}" {% if task and task.assigned_to_id==user.id %}selected{%
                                    endif %}>
                                    {{ user.username }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                        <!-- Description -->
                        <div class="form-group mb-3">
                            <label for="description" class="form-label">
                                <i class="fas fa-align-left"></i> Description
                            </label>
                            <textarea class="form-control" id="description" name="description" rows="4"
                                placeholder="Enter task description">{{ task.description if task else '' }}</textarea>
                        </div>

                        <div class="row">
                            <!-- Priority -->
                            <div class="col-md-6">
                                <div class="form-group mb-3">
                                    <label for="priority" class="form-label">
                                        <i class="fas fa-exclamation"></i> Priority
                                    </label>
                                    <select class="form-select" id="priority" name="priority">
                                        <option value="Low" {% if task and task.priority=='Low' %}selected{% endif %}>
                                            Low</option>
                                        <option value="Medium" {% if task and task.priority=='Medium' %}selected{% endif
                                            %}>Medium</option>
                                        <option value="High" {% if task and task.priority=='High' %}selected{% endif %}>
                                            High</option>
                                        <option value="Urgent" {% if task and task.priority=='Urgent' %}selected{% endif
                                            %}>Urgent</option>
                                    </select>
                                </div>
                            </div>

                            <!-- Status -->
                            <div class="col-md-6">
                                <div class="form-group mb-3">
                                    <label for="status" class="form-label">
                                        <i class="fas fa-check-circle"></i> Status
                                    </label>
                                    <select class="form-select" id="status" name="status">
                                        <option value="Pending" {% if not task or task.status=='Pending' %}selected{%
                                            endif %}>Pending</option>
                                        <option value="In Progress" {% if task and task.status=='In Progress'
                                            %}selected{% endif %}>In Progress</option>
                                        <option value="Completed" {% if task and task.status=='Completed' %}selected{%
                                            endif %}>Completed</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <!-- Due Date -->
                        <div class="form-group mb-3">
                            <label for="due_date" class="form-label">
                                <i class="fas fa-calendar-alt"></i> Due Date
                            </label>
                            <input type="date" class="form-control" id="due_date" name="due_date"
                                value="{{ task.due_date.strftime('%Y-%m-%d') if task and task.due_date else '' }}">
                        </div>

                        <!-- Buttons -->
                        <div class="form-group mt-4">
                            <button type="submit" class="btn btn-primary me-2">
                                <i class="fas fa-save"></i> {{ action }} Task
                            </button>
                            <a href="{{ url_for('tasks.list_tasks') }}" class="btn btn-secondary">
                                <i class="fas fa-times"></i> Cancel
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
